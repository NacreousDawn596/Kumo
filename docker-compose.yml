services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kumo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kumo}
      POSTGRES_DB: kumo
    volumes:
      - kumo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kumo -d kumo"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882-7890:7882-7890/udp"
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    command: -c /etc/turnserver.conf
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./infra/turnserver.conf:/etc/turnserver.conf:ro
    restart: unless-stopped

  backend:
    image: kumo-backend
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://kumo:${POSTGRES_PASSWORD:-kumo}@postgres:5432/kumo
      STORAGE_PATH: /app/data/storage
      SECRET_KEY: ${SECRET_KEY:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5480}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5480}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      # Shared HMAC secret with the SchoolApp identity worker.
      SCHOOLAPP_WORKER_SECRET: ${SCHOOLAPP_WORKER_SECRET:-}
      SCHOOLAPP_WORKER_ISSUER: schoolapp-worker
      SCHOOLAPP_WORKER_AUDIENCE: kumo
      # Web Push (VAPID).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@kumo.example.com}
      # LiveKit SFU (group audio) — served by the livekit container above.
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # TURN relay — served by the coturn container above.
      TURN_URIS: ${TURN_URIS:-turn:localhost:3478}
      TURN_USERNAME: ${TURN_USERNAME:-kumo}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    volumes:
      - kumo-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  radicale:
    image: kumo-backend
    build: ./backend
    command: sh -c "mkdir -p /app/data/radicale && uv run radicale --config /etc/radicale/config"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://kumo:${POSTGRES_PASSWORD:-kumo}@postgres:5432/kumo
    volumes:
      - ./infra/radicale_config:/etc/radicale/config:ro
      - kumo-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SCHOOLAPP_WORKER_URL: ${VITE_SCHOOLAPP_WORKER_URL:-https://schoolapp-worker.nacreousdawn596.workers.dev}
    ports:
      - "5480:80"
    depends_on:
      - backend
      - radicale
    restart: unless-stopped

volumes:
  kumo-data:
  kumo-pgdata:
