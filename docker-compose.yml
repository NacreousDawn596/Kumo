services:
  backend:
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: sqlite:////app/data/kumo.db
      STORAGE_PATH: /app/data/storage
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5480}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5480}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      # Shared HMAC secret with the SchoolApp identity worker.
      SCHOOLAPP_WORKER_SECRET: ${SCHOOLAPP_WORKER_SECRET:-}
      SCHOOLAPP_WORKER_ISSUER: schoolapp-worker
      SCHOOLAPP_WORKER_AUDIENCE: kumo
    volumes:
      - kumo-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SCHOOLAPP_WORKER_URL: ${VITE_SCHOOLAPP_WORKER_URL:-https://schoolapp-worker.nacreousdawn596.workers.dev}
    ports:
      - "5480:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  kumo-data:
