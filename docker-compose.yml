services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kumo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kumo}
      POSTGRES_DB: kumo
    volumes:
      - kumo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kumo -d kumo"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped
    profiles: ["livekit"]

  coturn:
    image: coturn/coturn:latest
    command: -n --log-file=stdout --lt-cred-mech --fingerprint
    environment:
      TURN_PORT: 3478
      TURN_USER: "${TURN_USERNAME:-kumo}"
      TURN_REALM: kumo
      TURN_SECRET: "${TURN_CREDENTIAL:-kumo-turn-secret}"
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
    restart: unless-stopped
    profiles: ["livekit"]

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://kumo:${POSTGRES_PASSWORD:-kumo}@postgres:5432/kumo
      STORAGE_PATH: /app/data/storage
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5480}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5480}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      # Shared HMAC secret with the SchoolApp identity worker.
      SCHOOLAPP_WORKER_SECRET: ${SCHOOLAPP_WORKER_SECRET:-}
      SCHOOLAPP_WORKER_ISSUER: schoolapp-worker
      SCHOOLAPP_WORKER_AUDIENCE: kumo
      # Web Push (VAPID).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@kumo.example.com}
      # LiveKit SFU (group audio).
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      # TURN relay.
      TURN_URIS: ${TURN_URIS:-}
      TURN_USERNAME: ${TURN_USERNAME:-kumo}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-kumo-turn-secret}
    volumes:
      - kumo-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SCHOOLAPP_WORKER_URL: ${VITE_SCHOOLAPP_WORKER_URL:-https://schoolapp-worker.nacreousdawn596.workers.dev}
    ports:
      - "5480:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  kumo-data:
  kumo-pgdata:
